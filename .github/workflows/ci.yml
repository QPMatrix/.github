# Gate = ./check, mirrored by .githooks/pre-commit (parity rule).
# checkout pin verified at birth via:
#   gh api repos/actions/checkout/releases/latest --jq .tag_name  -> v7.0.1
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    # Runner is a flag, never a literal (QPMSEC-639): vars.QPM_RUNNER, else
    # ubuntu-latest — labels and precedence live in qpm-gh-workflows' README "Runners".
    runs-on: ${{ vars.QPM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./check
