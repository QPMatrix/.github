# Refreshes the DYNAMIC block in profile/README.md (org profile page)
# from aggregate GitHub API signals — see scripts/update-profile.sh for
# the full privacy-by-construction explanation.
#
# DIRECT-PUSH-TO-MAIN EXCEPTION (QPMSEC-334, owner order 2026-08-20):
# this workflow commits and pushes straight to main with no PR, which
# worker-dispatch normally forbids for agent work. It is acceptable HERE
# ONLY because:
#   - the entire change surface is the text between
#     <!-- DYNAMIC:START --> and <!-- DYNAMIC:END --> in one file —
#     machine-generated, deterministic, and reviewed once (this PR),
#     not per-run;
#   - the renderer is privacy-filtered in code (see update-profile.sh
#     header) with a fixture test (update-profile.test.sh) gating it;
#   - main carries no branch protection today (confirmed via
#     `gh api repos/QPMatrix/.github/branches/main` -> protected:false),
#     so no setting stands in the way. If protection is ever added,
#     it must allow qpassistance[bot] to push, or this job needs a
#     PR-based flow instead — do not weaken protection to fit this job.
#
# This is the ONLY workflow in the estate with this exception; it does
# not set precedent for any other automation (worker-dispatch rule 3).

name: Update org profile stats

on:
  schedule:
    - cron: '17 4 * * *' # daily, off-the-hour to avoid GitHub Actions cron pile-up
  workflow_dispatch: {}

permissions:
  contents: write # required to push the splice commit directly to main

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      # Pinned version verified via:
      #   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name
      # -> v3.2.0 (estate-standard mint pattern, matches qp-context/qp-api/etc CI).
      - name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ steps.qpmatrix-token.outputs.token }}
          persist-credentials: true

      - name: Render profile stats
        env:
          GITHUB_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
          OWNER: QPMatrix
        run: sh scripts/update-profile.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "update-profile: no change, nothing to push"
            exit 0
          fi
          git config user.name "qpassistance[bot]"
          git config user.email "qpassistance[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(profile): refresh org stats [skip ci]"
          git push origin HEAD:main
